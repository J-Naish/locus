name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS and Rust
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Show toolchain versions
        run: |
          rustc --version
          cargo --version
          xcodebuild -version

      - name: Check Rust formatting
        run: cargo fmt --manifest-path core/Cargo.toml --all -- --check

      - name: Run Rust clippy
        run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path core/Cargo.toml

      - name: Run macOS unit tests
        run: |
          xcodebuild test \
            -project apps/mac/Locus/Locus.xcodeproj \
            -scheme Locus \
            -destination 'platform=macOS' \
            -only-testing:LocusTests

      - name: Run performance smoke budgets
        run: LOCUS_PERF_ITERATIONS=2 scripts/perf-smoke.sh
