[workspace]
members = [
    "crates/app-core",
    "crates/app-ffi",
    "crates/app-cli",
    "crates/terminal",
    "crates/pty",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "UNLICENSED"
repository = "https://github.com/nash/locus"
rust-version = "1.83"

[workspace.lints.rust]
unsafe_code = "warn"

[profile.release]
# Keep the default panic=unwind: app-ffi's catch_unwind firewall must be able
# to convert core panics into LOCUS_TERM_STATUS_PANIC instead of aborting the
# host app. (perf/size cost measured and accepted.)

# The terminal port carries ghostty's capacity-stress tests (hash sets filled
# to their layout cap), which are quadratic-probing-heavy and ~18x slower at
# opt-level 0. Light optimization keeps the suite fast while debug_assertions
# stay enabled.
[profile.test]
opt-level = 1
