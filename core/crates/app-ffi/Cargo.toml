[package]
name = "app-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "app_ffi"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
app-core = { path = "../app-core" }
terminal = { path = "../terminal" }
pty = { path = "../pty" }

# This crate is the audited C ABI boundary. It intentionally does not inherit
# the workspace `unsafe_code` lint because its public surface is implemented
# with `unsafe extern "C"` functions and reviewed SAFETY comments.
